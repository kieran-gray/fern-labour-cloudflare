[package]
name = "fern_labour_track_worker"
version.workspace = true
edition.workspace = true

[lib]
crate-type = ["cdylib"]

[dependencies]
tracing.workspace = true
tracing-web.workspace = true
tracing-subscriber.workspace = true
time.workspace = true
worker.workspace = true
serde.workspace = true
serde_json.workspace = true
uuid.workspace = true
async-trait.workspace = true
chrono.workspace = true
anyhow.workspace = true
wasm-bindgen = "0.2.108"
base64 = "0.22"
hmac = "0.12"
sha2 = "0.10"
hex = "0.4"
rand.workspace = true

fern-labour-event-sourcing-rs.workspace = true
fern-labour-workers-shared.workspace = true
fern-labour-labour-shared.workspace = true
fern-labour-notifications-shared.workspace = true

[target.'cfg(target_arch = "wasm32")'.dependencies]
getrandom = { workspace = true, features = ["wasm_js"] }

[target.'cfg(not(target_arch = "wasm32"))'.dependencies]
getrandom.workspace = true

[dev-dependencies]
tokio = "1.47.1"
wiremock = "0.6.5"
