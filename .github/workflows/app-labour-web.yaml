name: Labour Web CI/CD

on:
  push:
    branches:
      - main
    paths:
      - 'apps/labour/web/**'
      - 'packages/ui/**'
      - 'package-lock.json'
      - '.github/workflows/app-labour-web.yaml'
  pull_request:
    branches:
      - main
    paths:
      - 'apps/labour/web/**'
      - 'packages/ui/**'
      - 'package-lock.json'
      - '.github/workflows/app-labour-web.yaml'
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read
  deployments: write

jobs:
  ci:
    runs-on: ubuntu-latest
    name: CI

    defaults:
      run:
        working-directory: ./apps/labour/web

    steps:
      - name: Checkout repository
        uses: actions/checkout@v6

      - name: Setup Node.js
        uses: actions/setup-node@v6
        with:
          node-version-file: './apps/labour/web/.nvmrc'
          cache: 'npm'
          cache-dependency-path: ./apps/labour/web/package-lock.json

      - name: Install dependencies
        run: npm ci

      - name: Run linting
        run: npm run lint

      - name: Run type checking
        run: npm run typecheck

      - name: Run tests
        run: npm test

  deploy:
    needs: ci
    runs-on: ubuntu-latest
    if: github.ref == 'refs/heads/main' && github.event_name == 'push'
    permissions:
      contents: read
      deployments: write
    name: Deploy to Cloudflare Workers

    defaults:
      run:
        working-directory: ./apps/labour/web

    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Setup Node.js
        uses: actions/setup-node@v6
        with:
          node-version-file: './apps/labour/web/.nvmrc'
          cache: 'npm'
          cache-dependency-path: ./apps/labour/web/package-lock.json

      - name: Install dependencies
        run: npm ci
        
      - name: Install Wrangler v4
        run: npm install --save-dev wrangler@4

      - name: Deploy Worker
        uses: cloudflare/wrangler-action@v4
        with:
          apiToken: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          accountId: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          workingDirectory: ./apps/labour/web
